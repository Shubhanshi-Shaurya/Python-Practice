{% extends "base.html" %}
{% block content %}

<div class="container"> 
    <h2>Update user</h2>
    <form method='post'>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="text" name='username' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value={{user.username}}>
      <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" name='password' class="form-control" id="exampleInputPassword1" value={{user.password}}>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>

{% endblock  %}
